services:
  rhidprocess:
    image: rhidprocess
    build:
      context: .
      dockerfile: RhidProcess/Dockerfile
    ports:
      - "${HOST_PORT:-4563}:8080"
    environment:
      Rhid__Email: ${RHID_EMAIL:?RHID_EMAIL não configurado}
      Rhid__Password: ${RHID_PASSWORD:?RHID_PASSWORD não configurado}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ApiKey: ${API_KEY:-dev-api-key}
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/google-chrome-stable}
    shm_size: ${SHM_SIZE:-2gb}
    volumes:
      - ${LOGS_PATH:-./Logs}:/app/Logs
    networks:
      - certificate_public
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --header=\"X-Api-Key: $${ApiKey}\" http://localhost:8080/v2/health/ready"
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

networks:
  certificate_public:
    name: certificate_public
